<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="submit" method="POST" autocomplete="on">
        <fieldset>
            <legend>Personal Information</legend>
            <label for="name">Name:</label>
            <input type="text" placeholder="Aymen Amir" id="name" name="name" required><br><br>
            <label for="email">Email:</label>
            <input type="email" placeholder="example@gmail.com" id="email" name="email" required><br><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required><br><br>
            <label for="tele">Telephone:</label>
            <input type="tel" id="tele" name="tele"><br><br>
            <label for="num">Number:</label>
            <input type="number" id="num" name="num" max="100" min="0" value="1"><br><br>
            <label for="url">URL:</label>
            <input type="url" id="url" name="url"><br><br>
        </fieldset>
        <fieldset>
            <legend>Date</legend>
            <label for="date">Date:</label>
            <input type="date" id="date" name="date"><br><br>
            <label for="datetime">DateTime:</label>
            <input type="datetime" id="datetime" name="datetime"><br><br>
            <label for="datetime-local">DateTime Local:</label>
            <input type="datetime-local" id="datetime-local" name="datetime-local"><br><br>
            <label for="Time">Time:</label>
            <input type="time" id="Time" name="Time"><br><br>
            <label for="month">Month:</label>
            <input type="month" id="month" name="month"><br><br>
            <label for="week">Week:</label>
            <input type="week" id="week" name="week"><br><br>
            <label for="day">Day:</label>
            <input type="day" id="day" name="day"><br><br>
        </fieldset><br>
        <select>
            <optgroup label="Africa">
                <option value="ethiopia">Ethiopia</option>
                <option value="kenya">Kenya</option>
            </optgroup>
            <optgroup label="Europe">
                <option value="france">France</option>
                <option value="italy">Italy</option>
            </optgroup>
        </select><br><br>
        <input type="range" min="0" max="100"><br><br>
        <meter value="90" min="0" max="100" low="30" high="70"optimum="60"></meter><br><br>
        <progress value="30"></progress><br><br>
        <label for="hidden">Hidden:</label>
        <input type="hidden" value="">
    </form>
</body>
</html>
